# venus-felicity-bridge - example configuration
# Copy to /data/etc/felicity-bridge/config.ini (survives Venus OS updates) and adapt.
# Every key is optional; the value shown is the default.

[api]
# Local pack API that serves /api/battery<N>.json (see docs/api-contract.md)
base_url = http://127.0.0.1:8080
timeout = 5
# Poll interval of each pack bridge in seconds
poll_interval = 3

[venus]
velib_path = /opt/victronenergy/dbus-systemcalc-py/ext/velib_python

[packs]
# Pack numbers served by the API
numbers = 1 2 3
# Packs that must answer before the bank is published; the others are optional
required = 1 2
cells_per_pack = 16
# A BMS fault must be present in this many consecutive polls before it is raised
alarm_debounce_polls = 20

# One section per pack. serial is shown in the Venus GUI and VRM - keep it stable,
# a changed serial makes VRM/Home Assistant treat the pack as a new device.
[pack.1]
modbus_address = 1
serial = <serial-of-pack-1>
# device_instance = 1
# product_name = Felicity BMS Battery 1
# custom_name = Felicity Battery 1
# serial_port = /dev/ttyFelicityBMS

[pack.2]
modbus_address = 2
serial = <serial-of-pack-2>

[pack.3]
modbus_address = 4
serial = <serial-of-pack-3>

[bank]
device_instance = 512
# product_name = Felicity Battery Bank (3x16S)
custom_name = Felicity Battery Bank
serial = COMBINED_BANK
connection = Aggregated from 2x Felicity BMS
poll_interval = 5
# Seconds a pack's last SOC is carried forward when it drops out briefly
pack_soc_ttl = 900
# Register the bank service after this many seconds even without data (values stay invalid)
register_timeout = 90
# Capacity in Ah assumed when a pack does not report RatedCapacity
default_capacity = 200
